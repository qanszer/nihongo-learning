<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Numbers & Time Quiz</title>
    <style>
        :root {
            --primary: #bf616a;
            --primary-hover: #bf616a;
            --secondary: #2b313c;
            --bg-color: #252a34;
            --card-bg: #2b313c;
            --text-color: #f5f5f5;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }
        p.subtitle {
            margin-top: 0;
            margin-bottom: 25px;
            color: #6c757d;
        }
        .control-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .divider {
            height: 30px;
            width: 2px;
            background-color: #dee2e6;
            margin: 0 5px;
        }
        button {
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
            border: 2px solid var(--secondary);
            background-color: transparent;
            color: var(--text-color);
            border-radius: 6px;
            transition: all 0.2s ease-in-out;
            font-weight: bold;
        }
        button.active {
            background-color: var(--secondary);
            color: white;
        }
        button.action-btn {
            border-color: var(--primary);
            color: var(--primary);
        }
        button.action-btn:hover {
            background-color: var(--primary);
            color: white;
        }
        button:hover:not(.action-btn) {
            background-color: var(--secondary);
            color: white;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 30px auto;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid transparent;
        }
        .prompt-text {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 2px solid #dee2e6;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input.correct {
            border-color: #2a9d8f;
            background-color: #e9f5f4;
        }
        input.incorrect {
            border-color: #e76f51;
            background-color: #fcece8;
        }
        .answer-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #2a9d8f;
            font-weight: bold;
            min-height: 15px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .show-answers .answer-hint {
            opacity: 1;
        }
    </style>
</head>
<body>

    <h1>Japanese Numbers & Time Quiz</h1>
    <p class="subtitle">Interactive Romaji Reading Practice</p>

    <div class="control-group">
        <button id="btn-set-pdf" class="active" onclick="setQuizType('pdf')">Number Set (PDF)</button>
        <button id="btn-set-random" onclick="setQuizType('random')">50 Random Numbers</button>
        <button id="btn-set-time" onclick="setQuizType('time')">Telling Time (PDF)</button>
        
        <div class="divider"></div>
        
        <button id="btn-mode-jp" class="active" onclick="setPromptMode('jp')">Show JP (Kanji/Kana)</button>
        <button id="btn-mode-number" onclick="setPromptMode('number')">Show Numbers/Time</button>
        
        <div class="divider"></div>
        
        <button id="btn-shuffle" class="action-btn" onclick="shuffleOrGenerate()">🔀 Randomize Order</button>
        <button id="btn-answers" class="action-btn" onclick="toggleAnswers()">👁️ Show Answers</button>
    </div>

    <div id="quiz-grid" class="grid"></div>

    <script>
        // Standard dataset compiled from "Lesson 04_Japanese Counters.pdf"
        const pdfData = [
            { num: "0", jpText: "零", romaji: "zero/ree" },
            { num: "1", jpText: "一", romaji: "ichi" },
            { num: "2", jpText: "二", romaji: "ni" },
            { num: "3", jpText: "三", romaji: "san" },
            { num: "4", jpText: "四", romaji: "yon/shi" },
            { num: "5", jpText: "五", romaji: "go" },
            { num: "6", jpText: "六", romaji: "roku" },
            { num: "7", jpText: "七", romaji: "nana/shichi" },
            { num: "8", jpText: "八", romaji: "hachi" },
            { num: "9", jpText: "九", romaji: "kyuu/ku" },
            { num: "10", jpText: "十", romaji: "juu" },
            { num: "11", jpText: "十一", romaji: "juu-ichi" },
            { num: "20", jpText: "二十", romaji: "ni-juu" },
            { num: "25", jpText: "二十五", romaji: "ni-juu-go" },
            { num: "30", jpText: "三十", romaji: "san-juu" },
            { num: "40", jpText: "四十", romaji: "yon-juu" },
            { num: "50", jpText: "五十", romaji: "go-juu" },
            { num: "99", jpText: "九十九", romaji: "kyuu-juu-kyuu" },
            { num: "100", jpText: "百", romaji: "hyaku" },
            { num: "200", jpText: "二百", romaji: "ni-hyaku" },
            { num: "300", jpText: "三百", romaji: "sanbyaku" },
            { num: "400", jpText: "四百", romaji: "yon-hyaku" },
            { num: "500", jpText: "五百", romaji: "go-hyaku" },
            { num: "600", jpText: "六百", romaji: "roppyaku" },
            { num: "700", jpText: "七百", romaji: "nana-hyaku" },
            { num: "800", jpText: "八百", romaji: "happyaku" },
            { num: "900", jpText: "九百", romaji: "kyuu-hyaku" },
            { num: "1000", jpText: "千", romaji: "sen" },
            { num: "2000", jpText: "二千", romaji: "ni-sen" },
            { num: "3000", jpText: "三千", romaji: "sanzen" },
            { num: "4000", jpText: "四千", romaji: "yon-sen" },
            { num: "8000", jpText: "八千", romaji: "hassen" },
            { num: "10,000", jpText: "一万", romaji: "ichi-man" },
            { num: "50,000", jpText: "五万", romaji: "go-man" },
            { num: "100,000", jpText: "十万", romaji: "juu-man" }
        ];

        // Telling Time dataset compiled from "Lesson 05_Telling Time.pdf"
        const timeData = [
            // Hours
            { num: "1:00", jpText: "いちじ", romaji: "ichi-ji" },
            { num: "2:00", jpText: "にじ", romaji: "ni-ji" },
            { num: "3:00", jpText: "さんじ", romaji: "san-ji" },
            { num: "4:00", jpText: "よじ", romaji: "yo-ji" },
            { num: "5:00", jpText: "ごじ", romaji: "go-ji" },
            { num: "6:00", jpText: "ろくじ", romaji: "roku-ji" },
            { num: "7:00", jpText: "しちじ", romaji: "shichi-ji" },
            { num: "8:00", jpText: "はちじ", romaji: "hachi-ji" },
            { num: "9:00", jpText: "くじ", romaji: "ku-ji" },
            { num: "10:00", jpText: "じゅうじ", romaji: "juu-ji" },
            { num: "11:00", jpText: "じゅういちじ", romaji: "juu-ichi-ji" },
            { num: "12:00", jpText: "じゅうにじ", romaji: "juu-ni-ji" },
            // Half Hours
            { num: "1:30", jpText: "いちじはん", romaji: "ichi-ji-han" },
            { num: "2:30", jpText: "にじはん", romaji: "ni-ji-han" },
            { num: "3:30", jpText: "さんじはん", romaji: "san-ji-han" },
            { num: "4:30", jpText: "よじはん", romaji: "yo-ji-han" },
            { num: "5:30", jpText: "ごじはん", romaji: "go-ji-han" },
            { num: "6:30", jpText: "ろくじはん", romaji: "roku-ji-han" },
            { num: "7:30", jpText: "しちじはん", romaji: "shichi-ji-han" },
            { num: "8:30", jpText: "はちじはん", romaji: "hachi-ji-han" },
            { num: "9:30", jpText: "くじはん", romaji: "ku-ji-han" },
            { num: "10:30", jpText: "じゅうはん", romaji: "juu-ji-han/juu-han" }, 
            { num: "11:30", jpText: "じゅういちじはん", romaji: "juu-ichi-ji-han" },
            { num: "12:30", jpText: "じゅうにじはん", romaji: "juu-ni-ji-han" },
            // Minutes
            { num: "1 min", jpText: "いっぷん", romaji: "ippun" },
            { num: "2 min", jpText: "にふん", romaji: "nifun" },
            { num: "3 min", jpText: "さんぷん", romaji: "sanpun" },
            { num: "4 min", jpText: "よんぷん", romaji: "yonpun" },
            { num: "5 min", jpText: "ごふん", romaji: "gofun" },
            { num: "6 min", jpText: "ろっぷん", romaji: "roppun" },
            { num: "7 min", jpText: "ななふん", romaji: "nanafun" },
            { num: "8 min", jpText: "はっぷん", romaji: "happun" },
            { num: "9 min", jpText: "きゅうふん", romaji: "kyuufun" },
            { num: "10 min", jpText: "じゅっぷん", romaji: "juppun" },
            { num: "11 min", jpText: "じゅういっぷん", romaji: "juu-ippun" },
            { num: "12 min", jpText: "じゅうにふん", romaji: "juu-nifun" },
            { num: "13 min", jpText: "じゅうさんぷん", romaji: "juu-sanpun" },
            { num: "14 min", jpText: "じゅうよんぷん", romaji: "juu-yonpun" },
            { num: "15 min", jpText: "じゅうごふん", romaji: "juu-gofun" },
            { num: "16 min", jpText: "じゅうろっぷん", romaji: "juu-roppun" },
            { num: "17 min", jpText: "じゅうななふん", romaji: "juu-nanafun" },
            { num: "18 min", jpText: "じゅうはっぷん", romaji: "juu-happun" },
            { num: "19 min", jpText: "じゅうきゅうふん", romaji: "juu-kyuufun" },
            { num: "20 min", jpText: "にじゅっぷん", romaji: "ni-juppun" },
            { num: "25 min", jpText: "にじゅうごふん", romaji: "ni-juu-gofun" },
            { num: "30 min", jpText: "さんじゅっぷん", romaji: "san-juppun" },
            { num: "35 min", jpText: "さんじゅうごふん", romaji: "san-juu-gofun" },
            { num: "40 min", jpText: "よんじゅっぷん", romaji: "yon-juppun" },
            { num: "45 min", jpText: "よんじゅうごふん", romaji: "yon-juu-gofun" },
            { num: "50 min", jpText: "ごじゅっぷん", romaji: "go-juppun" },
            { num: "55 min", jpText: "ごじゅうごふん", romaji: "go-juu-gofun" },
            { num: "59 min", jpText: "ごじゅうきゅうふん", romaji: "go-juu-kyuufun/ni-juu-kyuufun" }
        ];

        let currentData = [...pdfData];
        let quizType = 'pdf';     // 'pdf', 'random', or 'time'
        let promptMode = 'jp';    // 'jp' or 'number'

        // Helper function to convert integer to Japanese Kanji & Romaji (up to 10,000)
        function convertNumberToJapanese(n) {
            if (n === 0) return { jpText: "零", romaji: "zero/ree" };
            if (n === 10000) return { jpText: "一万", romaji: "ichi-man" };

            const kanjiDigits = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
            const romajiDigits = ["", "ichi", "ni", "san", "yon", "go", "roku", "nana", "hachi", "kyuu"];

            let k_thousands = "", r_thousands = "";
            let k_hundreds = "", r_hundreds = "";
            let k_tens = "", r_tens = "";
            let k_ones = "", r_ones_options = [];

            const thousands = Math.floor(n / 1000);
            const hundreds = Math.floor((n % 1000) / 100);
            const tens = Math.floor((n % 100) / 10);
            const ones = n % 10;

            if (thousands > 0) {
                if (thousands === 1) { k_thousands = "千"; r_thousands = "sen"; }
                else if (thousands === 3) { k_thousands = "三千"; r_thousands = "sanzen"; }
                else if (thousands === 8) { k_thousands = "八千"; r_thousands = "hassen"; }
                else { k_thousands = kanjiDigits[thousands] + "千"; r_thousands = romajiDigits[thousands] + "-sen"; }
            }
            if (hundreds > 0) {
                if (hundreds === 1) { k_hundreds = "百"; r_hundreds = "hyaku"; }
                else if (hundreds === 3) { k_hundreds = "三百"; r_hundreds = "sanbyaku"; }
                else if (hundreds === 4) { k_hundreds = "四百"; r_hundreds = "yon-hyaku"; }
                else if (hundreds === 6) { k_hundreds = "六百"; r_hundreds = "roppyaku"; }
                else if (hundreds === 8) { k_hundreds = "八百"; r_hundreds = "happyaku"; }
                else { k_hundreds = kanjiDigits[hundreds] + "百"; r_hundreds = romajiDigits[hundreds] + "-hyaku"; }
            }
            if (tens > 0) {
                if (tens === 1) { k_tens = "十"; r_tens = "juu"; }
                else { k_tens = kanjiDigits[tens] + "十"; r_tens = romajiDigits[tens] + "-juu"; }
            }
            if (ones > 0) {
                k_ones = kanjiDigits[ones];
                if (ones === 4) r_ones_options = ["yon", "shi"];
                else if (ones === 7) r_ones_options = ["nana", "shichi"];
                else if (ones === 9) r_ones_options = ["kyuu", "ku"];
                else r_ones_options = [romajiDigits[ones]];
            } else {
                r_ones_options = [""];
            }

            const jpText = k_thousands + k_hundreds + k_tens + k_ones;
            const base_romaji = [r_thousands, r_hundreds, r_tens].filter(x => x).join("-");
            
            let romaji_list = [];
            if (r_ones_options[0] !== "") {
                r_ones_options.forEach(opt => {
                    romaji_list.push(base_romaji ? `${base_romaji}-${opt}` : opt);
                });
            } else {
                if (base_romaji) romaji_list.push(base_romaji);
            }

            return { jpText: jpText, romaji: romaji_list.join("/") };
        }

        // Generate 50 random numbers
        function generateRandomSet() {
            const set = [];
            for (let i = 0; i < 50; i++) {
                let n;
                if (Math.random() < 0.3) {
                    n = Math.floor(Math.random() * 1000);
                } else {
                    n = Math.floor(Math.random() * 91 + 10) * 100; 
                }
                const data = convertNumberToJapanese(n);
                const numStr = n >= 1000 ? n.toLocaleString() : n.toString();
                set.push({ num: numStr, jpText: data.jpText, romaji: data.romaji });
            }
            return set;
        }

        function renderGrid() {
            const grid = document.getElementById('quiz-grid');
            grid.innerHTML = '';

            currentData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';

                const promptText = promptMode === 'jp' ? item.jpText : item.num;
                
                card.innerHTML = `
                    <div class="prompt-text">${promptText}</div>
                    <input type="text" placeholder="Type romaji..." data-index="${index}" oninput="checkAnswer(this)">
                    <div class="answer-hint">${item.romaji}</div>
                `;
                grid.appendChild(card);
            });
            
            document.body.classList.remove('show-answers');
            document.getElementById('btn-answers').innerText = "👁️ Show Answers";
        }

        function setQuizType(type) {
            quizType = type;
            document.getElementById('btn-set-pdf').classList.toggle('active', type === 'pdf');
            document.getElementById('btn-set-random').classList.toggle('active', type === 'random');
            document.getElementById('btn-set-time').classList.toggle('active', type === 'time');
            
            if (type === 'pdf') {
                currentData = [...pdfData];
                document.getElementById('btn-shuffle').innerText = "🔀 Randomize Order";
            } else if (type === 'time') {
                currentData = [...timeData];
                document.getElementById('btn-shuffle').innerText = "🔀 Randomize Order";
            } else {
                currentData = generateRandomSet();
                document.getElementById('btn-shuffle').innerText = "🔀 Generate New 50";
            }
            renderGrid();
        }

        function setPromptMode(mode) {
            promptMode = mode;
            document.getElementById('btn-mode-jp').classList.toggle('active', mode === 'jp');
            document.getElementById('btn-mode-number').classList.toggle('active', mode === 'number');
            renderGrid();
        }

        function shuffleOrGenerate() {
            if (quizType === 'pdf' || quizType === 'time') {
                // Fisher-Yates shuffle for standard static sets
                for (let i = currentData.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentData[i], currentData[j]] = [currentData[j], currentData[i]];
                }
            } else {
                // Generate brand new set for random mode
                currentData = generateRandomSet();
            }
            renderGrid();
        }

        function checkAnswer(inputEl) {
            const index = inputEl.getAttribute('data-index');
            const correctAnswerRaw = currentData[index].romaji;
            
            // Clean user input: lowercase, remove spaces and hyphens
            const userInput = inputEl.value.toLowerCase().replace(/[\s-]/g, '');
            
            // Clean valid answers
            const validAnswers = correctAnswerRaw.split('/').map(ans => ans.toLowerCase().replace(/[\s-]/g, ''));

            if (userInput === '') {
                inputEl.className = '';
            } else if (validAnswers.includes(userInput)) {
                inputEl.className = 'correct';
            } else {
                inputEl.className = 'incorrect';
            }
        }

        function toggleAnswers() {
            const body = document.body;
            body.classList.toggle('show-answers');
            const btn = document.getElementById('btn-answers');
            if (body.classList.contains('show-answers')) {
                btn.innerText = "👁️ Hide Answers";
            } else {
                btn.innerText = "👁️ Show Answers";
            }
        }

        // Initialize
        renderGrid();
    </script>
</body>
</html>
